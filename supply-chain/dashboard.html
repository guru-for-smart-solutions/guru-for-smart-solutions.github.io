<style>

  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;

  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good-ink:#0ca30c; --bad-ink:#e66767; --wash:rgba(57,135,229,.16); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin-inline:auto}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end;padding-top:28px;padding-bottom:18px;border-bottom:1px solid var(--ink)}
.top h1{font-size:clamp(24px,4vw,34px);font-weight:600;letter-spacing:-.01em}
.lede{color:var(--ink2);margin:6px 0 0;max-width:62ch}
.manifest{font-size:12px;color:var(--ink2);letter-spacing:.04em;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button+button{border-inline-start:1px solid var(--axis)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--grid);flex-wrap:wrap}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1)}
details.filters{margin-top:16px;border:1px solid var(--ring);border-radius:6px;background:var(--surface)}
details.filters>summary{cursor:pointer;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-weight:500;list-style:none}
details.filters>summary::-webkit-details-marker{display:none}
details.filters>summary::before{content:"\25B8";color:var(--ink2)}
details.filters[open]>summary::before{content:"\25BE"}
[dir="rtl"] details.filters:not([open])>summary::before{content:"\25C2"}
details.filters>summary .cnt{color:var(--ink2);font-weight:400;font-size:13px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px 22px;padding:4px 14px 14px}
.fg h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:500;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--axis);background:transparent;border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--wash);border-color:var(--s1);color:var(--ink)}
.reset{border:1px solid var(--axis);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:20px 36px;padding:26px 0 22px;border-bottom:1px solid var(--grid);align-items:end}
.hero .lab{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.hero .big{font-size:clamp(44px,7vw,64px);font-weight:600;letter-spacing:-.02em;line-height:1.05;margin-top:4px;overflow-wrap:anywhere}
.hero .sub{color:var(--ink2);font-size:13px;margin-top:6px}
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0}
.ledger>div{padding:2px 14px;border-inline-start:1px solid var(--grid);min-width:0}
.ledger .k{font-size:12px;color:var(--ink2);line-height:1.35}
.ledger .v{font-size:24px;font-weight:600;line-height:1.2;margin-top:3px;overflow-wrap:anywhere}
.delta{font-size:12px;margin-top:2px;display:flex;gap:4px;align-items:center}
.delta.good{color:var(--good-ink)} .delta.bad{color:var(--bad-ink)} .delta.flat{color:var(--ink2)}
.note{font-size:13px;color:var(--ink2);margin:10px 0 0}
section.blk{margin-top:30px}
.sh{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--grid);padding-bottom:6px;margin-bottom:14px}
.sh h2{font-size:20px;font-weight:600}
.badge{font-size:12px;color:var(--ink2);border:1px solid var(--axis);border-radius:4px;padding:1px 7px}
.finds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px 28px}
.find h3{font-size:16px;font-weight:600;margin-bottom:4px}
.find p{margin:0;color:var(--ink2);font-size:14px}
.find .n{font-size:12px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:6px;padding:16px;min-width:0}
.card.wide{grid-column:1/-1}
.card h3{font-size:16px;font-weight:600}
.card .s{font-size:13px;color:var(--ink2);margin:2px 0 12px}
.card .how{font-size:13px;color:var(--ink2);margin:12px 0 0;border-top:1px solid var(--grid);padding-top:8px}
.sub-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:14px 0 6px;font-weight:500}
.sub-h:first-of-type{margin-top:0}
.brow{display:grid;grid-template-columns:minmax(96px,170px) minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:3px 0}
.brow .bl{font-size:13px;line-height:1.3}
.brow .bl small{display:block;color:var(--ink2);font-size:12px}
.btrack{display:flex;flex-direction:column;gap:3px;border-inline-start:1px solid var(--axis);padding-block:1px;min-width:0}
.bar{height:12px;border-start-end-radius:4px;border-end-end-radius:4px;min-width:1px}
.brow .bv{font-size:13px;font-weight:500;min-width:48px;text-align:end;white-space:nowrap}
.cols{display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--axis);padding-top:8px;direction:ltr}
.cg{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.cg .pair{display:flex;align-items:flex-end;gap:2px;height:196px}
.cc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;width:clamp(16px,3.4vw,28px)}
.cc .cv{font-size:11px;color:var(--ink2);margin-bottom:2px;white-space:nowrap}

.clabels{display:flex;gap:10px;direction:ltr}
.clabels div{flex:1;text-align:center;font-size:12px;color:var(--ink2);padding-top:5px;min-width:0;line-height:1.3}
.clabels small{display:block;color:var(--ink2);opacity:.9}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin-bottom:10px;color:var(--ink2)}

.svgbox{direction:ltr}
.svgbox svg{width:100%;height:auto;display:block;overflow:visible}
.svgbox text{fill:var(--ink2);font-family:var(--font);font-size:11px}

.heat td{text-align:center;font-variant-numeric:tabular-nums;padding:7px 4px;border:2px solid var(--surface);min-width:56px}
.heat th{font-size:11px;text-align:center}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}

.acts{display:grid;gap:0;counter-reset:a}

.act:first-child{border-top:0}
.act .p{font-size:12px;color:var(--ink2);white-space:nowrap;padding-top:2px}
.act h3{font-size:15px;font-weight:600}
.act p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.models .m{border-inline-start:3px solid var(--s1);padding-inline-start:12px}

.models .m span{font-size:12px;color:var(--ink2)}
ul.plain{margin:0;padding-inline-start:20px;color:var(--ink2);font-size:14px}
ul.plain li{margin:4px 0}
#tip{position:fixed;z-index:50;max-width:280px;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:6px;font-size:12px;line-height:1.45;pointer-events:none;white-space:pre-line}
footer{margin-top:40px;padding-top:12px;border-top:1px solid var(--grid);font-size:12px;color:var(--ink2)}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .ledger>div{border-inline-start:0;border-top:1px solid var(--grid);padding:8px 0}
  .brow{grid-template-columns:minmax(0,1fr) auto}
  .brow .btrack{grid-column:1/-1;grid-row:2}
  .card{padding:14px}

es:{
 title:"Recuperación ante interrupciones de la cadena de suministro",
 lede:n=>`${n} incidentes de interrupción. Pérdidas de ingresos en dólares estadounidenses y recuperación en días.`,
 man:n=>`Registros de DIS-000001 a DIS-${String(n).padStart(6,"0")}`,
 tabE:"Resumen ejecutivo",tabA:"Mesa del analista",
 filters:"Filtros",reset:"Restablecer",showing:(a,b)=>`Mostrando ${a} de ${b} incidentes`,
 d:{industry:"Sector",type:"Tipo de interrupción",size:"Tamaño del proveedor",backup:"Proveedor de respaldo",severity:"Gravedad",response:"Estrategia de respuesta",tier:"Nivel del proveedor"},
 yes:"Con respaldo",no:"Sin respaldo",sev:v=>`Gravedad ${v}`,tier:v=>`Nivel ${v}`,
 days:v=>"días",
 incN:"incidentes",kLoss:"Pérdida total de ingresos",kInc:"Incidentes",kAvg:"Pérdida media por incidente",kFull:"Recuperación total media",kPerm:"Cambio permanente de proveedor",kBackup:"Cobertura con proveedor de respaldo",
 vsAll:"frente a todos los incidentes",same:"igual que todos los incidentes",
 kNote:"Las cifras siguen los filtros. Las flechas comparan con todos los incidentes. Las medias se ven afectadas por unas pocas pérdidas muy grandes.",
 noData:"Ningún incidente cumple estos filtros.",
 findH:"Qué dicen los datos",fullData:"Basado en todos los incidentes; no cambia con los filtros.",
 f1t:"El tamaño del proveedor, el sector y la gravedad determinan la pérdida",
 f1b:(a,b,c,x,y,z)=>`Al quitar un factor del modelo, la variación explicada baja ${a} puntos con el tamaño del proveedor, ${b} con el sector y ${c} con la gravedad. Frente al grupo de referencia (proveedor pequeño, bienes de consumo, gravedad 1), la pérdida habitual es ${x} para un proveedor grande, ${y} en el sector aeroespacial y ${z} con gravedad 5. La región, el tipo de interrupción y la estrategia de respuesta casi no aportan una vez conocidos estos factores.`,
 f2t:"Un proveedor de respaldo acorta la recuperación, pero no reduce la pérdida",
 f2b:(a,d,w,wo,l)=>`Con tamaño, sector, tipo, gravedad, nivel y región constantes, la recuperación total es un ${a} más corta con respaldo (unos ${d} días por incidente; mediana de ${w} frente a ${wo} días sin ajustar). La pérdida de ingresos no cambia (${l}, sin significancia estadística).`,
 f3t:"Pasar a un proveedor alternativo es la respuesta más rápida",
 f3b:(cd,pr,cs,ib,cm,sh)=>`Frente al proveedor alternativo, la recuperación total tarda ${cd} más con el retraso al cliente, ${pr} con la reorientación de la producción, ${cs} con la estrategia combinada y ${ib} con el inventario de seguridad. La estrategia combinada parece la peor sin ajustar (mediana de ${cm} días) porque se usa en los eventos más graves (${sh} de los casos de gravedad 5).`,
 f4t:"Responder un día antes no acorta la recuperación por sí solo",
 f4b:(a,b,c,d,e,lo,hi)=>`Quienes responden rápido se recuperan antes en los datos brutos (mediana de ${a} días con 1 día frente a ${b} con 15 o más), pero ${c} de ellos tienen respaldo, frente a ${d}. Con el respaldo, la gravedad y la estrategia constantes, cada día adicional de respuesta cambia la recuperación en ${e} (intervalo de confianza del 95 %: de ${lo} a ${hi}).`,
 f5t:"El riesgo se concentra en un grupo pequeño de incidentes",
 f5b:(a,b,c,d,e)=>`El 10 % de incidentes más costosos causa ${a} de toda la pérdida. Los proveedores grandes del sector aeroespacial y farmacéutico son ${b} de los incidentes, pero ${c} de la pérdida, y los proveedores grandes suponen ${d} del 1 % más costoso (frente a ${e} del total).`,
 f6t:"Los eventos graves suelen terminar en un cambio permanente de proveedor",
 f6b:(a,b,c,d,e,f)=>`${a} de los incidentes terminan con un cambio permanente; la proporción llega a ${b} con gravedad 4 y 5, frente a ${c} con gravedad 1. Un proveedor de respaldo reduce a la mitad las probabilidades relativas (razón de momios ${d}). La proporción sube de ${e} a ${f} cuando la recuperación total supera unos 60 días.`,
 actH:"Acciones recomendadas",ev:"Evidencia",evS:"sólida",evM:"moderada",pri:n=>`Prioridad ${n}`,
 a1t:"Asegurar proveedores de respaldo donde se concentran las pérdidas",
 a1b:(a,b)=>`Empiece por los proveedores grandes de los sectores aeroespacial, farmacéutico y automotriz. Los proveedores grandes son ${a} de los incidentes, pero ${b} del 10 % más costoso.`,
 a2t:"Hacer del proveedor alternativo la respuesta por defecto",
 a2b:(a)=>`Cuando existe respaldo, cambiar a él es la opción más rápida. Reserve el retraso al cliente para eventos de baja gravedad: alarga la recuperación un ${a}.`,
 a3t:"Medir la cobertura de respaldo en lugar de metas de tiempo de respuesta",
 a3b:(a,b)=>`La cobertura es ${a} en total y ${b} entre los proveedores pequeños. La rapidez de respuesta no mostró un efecto independiente sobre la recuperación.`,
 a4t:"Planificar de antemano los eventos de gravedad 4 y 5",
 a4b:(a,b)=>`Cerca de ${a} terminan en un cambio permanente de proveedor, y ${b} si hay respaldo. Defina los criterios de cambio antes del evento.`,
 a5t:"Vigilar de cerca a los proveedores de nivel 1",
 a5b:(a,b,c)=>`Los incidentes de nivel 1 reducen la producción un ${a} de media, frente a ${b} en el nivel 4, aunque se recuperan unos ${c} días antes.`,
 c1t:"Dónde están las pérdidas",c1s:"Parte de la pérdida total de ingresos junto a la parte de incidentes (filtrado)",c1a:"Por tamaño del proveedor",c1b:"Por sector",ofLoss:"de la pérdida",ofInc:"de los incidentes",
 c2t:"Recuperación con y sin proveedor de respaldo",c2s:"Días medios hasta la recuperación total, por gravedad (filtrado)",
 c3t:"Las pérdidas están concentradas",c3s:"Parte acumulada de la pérdida de ingresos, con los incidentes ordenados de mayor a menor (todos los incidentes)",
 c3x:"Parte de los incidentes, de mayor a menor pérdida",c3y:"Parte de la pérdida total",c3n:(a,b)=>`El 10 % de incidentes más costosos causa ${a} de toda la pérdida. ${b} de los incidentes reúnen el 80 %.`,
 tv:"Ver tabla",

 g3t:"Efecto del proveedor de respaldo",g3s:"Medianas brutas y efecto con tamaño, sector, tipo, gravedad, nivel y región constantes",
 mFull:"Recuperación total",mPart:"Recuperación parcial",mResp:"Tiempo de respuesta",mLoss:"Pérdida de ingresos",mImp:"Impacto en la producción",
 withB:"Con respaldo",noB:"Sin respaldo",adj:"Efecto ajustado",ci:"Intervalo del 95 %",pts:"pts",
 g3h:"Lectura: la pérdida bruta parece mayor con respaldo solo porque el 70 % de los proveedores grandes lo tienen. Tras el ajuste el efecto en la pérdida es nulo, mientras que la recuperación es un 28 % más corta.",
 g3b:"Mediana de días hasta la recuperación total, por tamaño del proveedor",covS:"Cobertura de respaldo por tamaño",
 g4t:"¿Qué estrategia de respuesta recupera más rápido?",g4s:"Tiempo de recuperación adicional frente al proveedor alternativo tras el ajuste (intervalo del 95 % en la tabla)",g4f:"Recuperación total",g4p:"Recuperación parcial",
 g4h:"Lectura: el retraso al cliente es la opción más lenta. La estrategia combinada parece la peor sin ajustar solo porque se usa en eventos graves.",g4m:"Mediana de recuperación total sin ajustar (días)",
 g5t:"¿Importa la rapidez de respuesta?",g5s:"Días medios hasta la recuperación total según los días en responder (sin ajustar)",

/* ---------- formatting ---------- */
const nfc={};
function nf(v,d=0){const k=S.lang+d;if(!nfc[k])nfc[k]=new Intl.NumberFormat(LOC[S.lang],{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:"always"});return nfc[k].format(v)}
const ltr=s=>S.lang==="ar"?"⁦"+s+"⁩":s;
const NB=" ";
function pc(x,d=0){return ltr(nf(x*100,d)+(S.lang==="es"?NB:"")+"%")}
function spc(x,d=0){return ltr((x<0?"−":"+")+nf(Math.abs(x*100),d)+(S.lang==="es"?NB:"")+"%")}
function mult(x,d=1){return ltr(nf(x,d)+"×")}
const MU={en:{b:"B",m:"M",k:"K",f:(s,u)=>"$"+s+u},es:{b:" mil M",m:" M",k:" mil",f:(s,u)=>s+u+NB+"US$"},ar:{b:" مليار",m:" مليون",k:" ألف",f:(s,u)=>s+u+" دولار"}};
function money(v,d=1){const a=Math.abs(v),U=MU[S.lang];let n=v,u="";
 if(a>=1e9){n=v/1e9;u=U.b}else if(a>=1e6){n=v/1e6;u=U.m}else if(a>=1e3){n=v/1e3;u=U.k}
 const dd=u?(Math.abs(n)>=100?0:d):0;return U.f(nf(n,dd),u)}
function dayw(v){if(S.lang==="en")return "days";if(S.lang==="es")return "días";
 const r=Math.round(v);if(Math.abs(v-1)<1e-9)return "يوم";return (r>=3&&r<=10)?"أيام":"يومًا"}
function dd(v,d=0){return nf(v,d)+" "+dayw(v)}
function lab(dim,idx){const raw=LAB[CUBE.dims[DIMS.indexOf(dim)]][idx];
 if(dim==="backup")return raw?t().yes:t().no;if(dim==="severity")return t().sev(raw);if(dim==="tier")return t().tier(raw);return NAMES[S.lang][dim][raw]}

function filtered(){const s=S.sel;return CUBE.rows.filter(r=>{for(let i=0;i<7;i++)if(!s[i].has(r[i]))return false;return true})}
function blank(){return{n:0,loss:0,logloss:0,full:0,partial:0,impact:0,resp:0,perm:0}}
function add(g,r){g.n+=r[7];g.loss+=r[8];g.logloss+=r[9];g.full+=r[10];g.partial+=r[11];g.impact+=r[12];g.resp+=r[13];g.perm+=r[14]}

function groupBy(rows,idx){const m=new Map();for(const r of rows){const k=idx.map(i=>r[i]).join("|");let g=m.get(k);if(!g){g=blank();g.key=idx.map(i=>r[i]);m.set(k,g)}add(g,r)}return m}

/* ---------- theme helpers ---------- */
function isDark(){const a=document.documentElement.getAttribute("data-theme");if(a)return a==="dark";return matchMedia("(prefers-color-scheme: dark)").matches}

function heat(tv){const n=RAMP.length-1;let i=Math.round(Math.max(0,Math.min(1,tv))*n);if(isDark())i=n-i;const bg=RAMP[i];return{bg,fg:lum(bg)>.28?"#0b0b0b":"#ffffff"}}

 <div class="bv">${it.text}</div></div>`).join("")}
function cols(groups,series,o={}){ // groups:[{label,sub,vals:[],tips:[]}]
 const max=o.max||Math.max(...groups.flatMap(g=>g.vals.filter(v=>isFinite(v))),1);const H=176;

/* ---------- pareto svg ---------- */
function pareto(){const P=RES.pareto,w=420,h=250,l=44,b=34,r=14,tp=12,pw=w-l-r,ph=h-b-tp;
 const X=x=>l+x*pw,Y=y=>tp+(1-y)*ph;const pts=P.curve.map(p=>`${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`);
 const area=`M${X(0)},${Y(0)} L${pts.join(" L")} L${X(1)},${Y(0)} Z`;
 const mk=(x,y,lbl,dx,dy,anchor)=>`<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><text x="${X(x)+dx}" y="${Y(y)+dy}" text-anchor="${anchor}" style="fill:var(--ink);font-weight:500">${lbl}</text>`;
 const grid=[0,.25,.5,.75,1].map(v=>`<line x1="${l}" x2="${w-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*100)}%</text>`).join("");
 const xt=[0,.25,.5,.75,1].map(v=>`<text x="${X(v)}" y="${h-b+16}" text-anchor="middle">${Math.round(v*100)}%</text>`).join("");
 const p10=P.top10,p20=P.top20;
 return `<div class="svgbox"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t().c3t)}">${grid}${xt}<path d="${area}" fill="var(--s1)" fill-opacity=".10"/><polyline points="${pts.join(" ")}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
 <line x1="${l}" y1="${Y(0)}" x2="${w-r}" y2="${Y(0)}" stroke="var(--axis)"/>${mk(.1,p10,pc(p10),10,2,"start")}${mk(.2,p20,pc(p20),10,-8,"start")}
 <text x="${l+pw/2}" y="${h-4}" text-anchor="middle">${esc(t().c3x)}</text></svg></div>`}

function deltaHTML(cur,base,dir,fmt){ // dir: +1 up-is-bad, -1 up-is-good

 if(Math.abs(r)<.005)return `<div class="delta flat">${esc(t().same)}</div>`;
 const up=r>0;const bad=(dir>0)?up:!up;
 return `<div class="delta ${bad?"bad":"good"}"><span aria-hidden="true">${up?"▲":"▼"}</span><span>${spc(r,0)} ${esc(t().vsAll)}</span></div>`}

 // g8 models
 const mr=M.full_recovery_at_event_start,mr2=M.full_recovery_with_response,ml=M.loss_at_event_start;
 h+=card(L.g8t,esc(L.g8s),`<div class="models"><div class="m"><b>${nf(mr.r2_log,2)}</b><span>${esc(L.mR2)}<br>${esc(L.mR2s(nf(mr.r2_log,2),nf(mr.mae_native,0),nf(mr.mae_baseline_native,0)))}</span></div>
 <div class="m"><b>${nf(mr2.r2_log,2)}</b><span>${esc(L.mR3)}<br>${esc(L.mR3s(nf(mr2.r2_log,2)))}</span></div>
 <div class="m"><b>${nf(ml.r2_log,2)}</b><span>${esc(L.mL)}<br>${esc(L.mLs(nf(ml.r2_log,2),money(ml.mae_native,2),money(ml.mae_baseline_native,2)))}</span></div>
 <div class="m"><b>${nf(a5.auc_pre_event,2)}</b><span>${esc(L.mP)}<br>${esc(L.mPs(nf(a5.auc_pre_event,2),nf(a5.auc_with_recovery,2)))}</span></div></div>`,"",{wide:true});
 // g9 segments table
 const seg=groupBy(rows,[0,2,1]);const gt2=total(rows);let sr9=[...seg.values()].map(g=>({ind:g.key[0],size:g.key[1],type:g.key[2],indS:nameOf("industry",LAB.industry[g.key[0]]),sizeS:nameOf("size",LAB.supplier_size[g.key[1]]),typeS:nameOf("type",LAB.disruption_type[g.key[2]]),n:g.n,loss:g.loss,avg:g.loss/g.n,full:g.full/g.n,perm:g.perm/g.n,share:gt2.loss?g.loss/gt2.loss:0}));

 const tb=shown.map(r=>`<tr><td>${esc(nameOf("industry",LAB.industry[r.ind]))}</td><td>${esc(nameOf("size",LAB.supplier_size[r.size]))}</td><td>${esc(nameOf("type",LAB.disruption_type[r.type]))}</td><td class="num">${nf(r.n)}</td><td class="num">${money(r.loss)}</td><td class="num">${money(r.avg,2)}</td><td class="num">${nf(r.full,1)}</td><td class="num">${pc(r.perm,1)}</td><td class="num">${pc(r.share,1)}</td></tr>`).join("");
 h+=card(L.g9t,esc(L.g9s),`<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>${sr9.length>12?`<p><button class="reset" id="seg-more">${esc(S.all?L.showLess:L.showAll(sr9.length))}</button></p>`:""}`,"",{wide:true});
 // g10 quality
 const Q=RES.quality.audit;
 h+=card(L.g10t,"",`<ul class="plain"><li>${esc(L.q1(nf(Q.rows)))}</li><li>${esc(L.q2(nf(Q.loss_floor_10000)))}</li><li>${esc(L.q3(nf(Q.response_gt_partial)))}</li><li>${esc(L.q4)}</li><li>${esc(L.q5)}</li><li>${esc(L.q6)}</li><li>${esc(L.q7)}</li><li>${esc(L.q8)}</li></ul>`,"",{wide:true});

/* ---------- shell rendering ---------- */
function renderFilters(){
 const L=t();const el=$("#filters");const open=el.hasAttribute("open");
 const n=total(filtered()).n;
 const groups=DIMS.map((d,i)=>{const dim=dimKey(i);return`<div class="fg"><h4>${esc(L.d[d])}</h4><div class="chips">${LAB[dim].map((_,j)=>`<button class="chip" data-d="${i}" data-j="${j}" aria-pressed="${S.sel[i].has(j)}">${esc(lab(d,j))}</button>`).join("")}</div></div>`}).join("");
 el.innerHTML=`<summary><span>${esc(L.filters)}</span><span class="cnt">${esc(L.showing(nf(n),nf(ALL.n)))}</span><button class="reset" id="reset" type="button">${esc(L.reset)}</button></summary><div class="fgrid">${groups}</div>`;
}
function renderView(){
 const rows=filtered();const v=$("#view");
 v.innerHTML=S.view==="executive"?execView(rows):analystView(rows);
 $("#tab-executive").setAttribute("aria-selected",S.view==="executive");$("#tab-analyst").setAttribute("aria-selected",S.view==="analyst");
 $("#tab-executive").textContent=t().tabE;$("#tab-analyst").textContent=t().tabA;
 const cnt=document.querySelector("#filters .cnt");if(cnt)cnt.textContent=t().showing(nf(total(rows).n),nf(ALL.n));
}
function renderAll(){
 const L=t();document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
 document.title=S.lang==="en"?"Disruption Recovery Board":L.title;
 $("#h-title").textContent=L.title;$("#h-lede").textContent=L.lede(nf(ALL.n));$("#h-man").textContent=L.man(ALL.n);$("#foot").textContent=L.foot;
 document.querySelectorAll("#langseg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.lang));
 renderFilters();renderView();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const lb=e.target.closest("#langseg button");if(lb){S.lang=lb.dataset.lang;try{localStorage.setItem("drb-lang",S.lang)}catch(x){}renderAll();return}
 const tb=e.target.closest("#tabs button");if(tb){S.view=tb.dataset.view;try{history.replaceState(null,"","#"+S.view)}catch(x){location.hash=S.view}renderView();return}
 const ch=e.target.closest(".chip");if(ch){const i=+ch.dataset.d,j=+ch.dataset.j;const s=S.sel[i],tot=LAB[dimKey(i)].length;if(s.size===tot){S.sel[i]=new Set([j])}else if(s.has(j)){if(s.size===1){S.sel[i]=new Set(LAB[dimKey(i)].map((_,k)=>k))}else s.delete(j)}else s.add(j);
  renderFilters();renderView();const f=document.querySelector(`.chip[data-d="${i}"][data-j="${j}"]`);if(f)f.focus();return}
 if(e.target.closest("#reset")){e.preventDefault();S.sel=DIMS.map((_,i)=>new Set(LAB[dimKey(i)].map((_,j)=>j)));renderFilters();renderView();return}
 const so=e.target.closest("[data-sort]");if(so){const k=so.dataset.sort;if(S.sort.k===k)S.sort.dir*=-1;else{S.sort={k,dir:(k==="ind"||k==="size"||k==="type")?1:-1}}renderView();const f=document.querySelector(`[data-sort="${k}"]`);if(f)f.focus();return}
 if(e.target.closest("#seg-more")){S.all=!S.all;renderView();return}
});
const tip=$("#tip");
function showTip(el,x,y){tip.textContent=el.getAttribute("data-tip");tip.hidden=false;const r=tip.getBoundingClientRect();let l=x+14,tp=y+16;if(l+r.width>innerWidth-8)l=Math.max(8,x-r.width-14);if(tp+r.height>innerHeight-8)tp=Math.max(8,y-r.height-14);tip.style.left=l+"px";tip.style.top=tp+"px"}
document.addEventListener("pointermove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)showTip(el,e.clientX,e.clientY);else tip.hidden=true});
document.addEventListener("pointerdown",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)showTip(el,e.clientX,e.clientY);else tip.hidden=true});
document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el){const r=el.getBoundingClientRect();showTip(el,r.left+r.width/2,r.top)}else tip.hidden=true});
document.addEventListener("scroll",()=>{tip.hidden=true},{passive:true});
window.addEventListener("hashchange",()=>{const h=(location.hash||"").slice(1);if((h==="analyst"||h==="executive")&&h!==S.view){S.view=h;renderView()}});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>renderView());
new MutationObserver(()=>renderView()).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
renderAll();
})();
</script>
<script>
/* Guru site bridge: syncs language/theme from the host page and reports height when embedded. */
(function(){
  if(window.parent===window){
    /* opened on its own: remember a language chosen here so the whole site follows it */
    document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("#langseg button");
      if(b&&b.dataset.lang){try{localStorage.setItem("guru-lang",b.dataset.lang)}catch(_e){}}});
    return;
  }
  var _s=document.createElement("style");_s.textContent="#langseg{display:none!important}";document.head.appendChild(_s);
  addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="guru-sync")return;
    if(d.theme==="dark"||d.theme==="light")document.documentElement.setAttribute("data-theme",d.theme);
    if(d.lang){var b=document.querySelector('#langseg button[data-lang="'+d.lang+'"]');if(b&&b.getAttribute("aria-pressed")!=="true")b.click()}});
  function h(){parent.postMessage({type:"guru-height",h:Math.ceil(document.body.getBoundingClientRect().height)},"*")}
  if(window.ResizeObserver)new ResizeObserver(h).observe(document.body);
  addEventListener("load",h);
  parent.postMessage({type:"guru-ready"},"*");
})();
</script>
