  --page:#f4f4f1; --surface:#fcfcfb; --surface-2:#f1f1ed; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#6f6d67;
  --line:#e1e0d9; --axis:#c3c2b7; --accent:#2a78d6; --accent-ink:#1c5cab; --accent-soft:rgba(42,120,214,.10);
  --s2:#eb6834; --s2-soft:rgba(235,104,52,.12); --good:#006300; --warn-bg:#fff6df; --warn-line:#e8c66a;
  --on-fill:#fff; --shadow:0 1px 2px rgba(11,11,11,.05),0 8px 24px rgba(11,11,11,.05);
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#a09f97;
    --line:#2c2c2a; --axis:#383835; --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:rgba(57,135,229,.16);
    --s2:#d95926; --s2-soft:rgba(217,89,38,.18); --good:#0ca30c; --warn-bg:#2a2412; --warn-line:#6b5a1d;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#a09f97;
  --line:#2c2c2a; --axis:#383835; --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:rgba(57,135,229,.16);
  --s2:#d95926; --s2-soft:rgba(217,89,38,.18); --good:#0ca30c; --warn-bg:#2a2412; --warn-line:#6b5a1d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
[dir="rtl"] body{line-height:1.85}
.wrap{max-width:1040px;margin-inline:auto}
a{color:var(--accent-ink)}
/* top bar */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:600;font-size:14px;color:var(--ink-2);display:flex;gap:10px;align-items:center;min-width:0}
.brand a{color:inherit;text-decoration:none}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:7px 14px;font-size:13.5px;font-weight:500;color:var(--ink-2);min-height:20px}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-fill)}
.seg button:focus-visible,.ibtn:focus-visible,.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ibtn{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:500}
.ibtn:hover{border-color:var(--accent)}
/* hero */
.hero{padding:44px 0 8px}
.eyebrow{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
[dir="rtl"] .eyebrow{letter-spacing:0;text-transform:none;font-size:14px}
h1{font-size:clamp(30px,5vw,48px);line-height:1.15;margin:10px 0 12px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
[dir="rtl"] h1{line-height:1.4;letter-spacing:0}
.sub{font-size:clamp(16px,2.2vw,19px);color:var(--ink-2);max-width:62ch;margin:0}
.meta{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--ink-3);font-size:14px}
.meta span{display:inline-flex;gap:6px;align-items:center}
.cta{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:14.5px;border-radius:10px;padding:10px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--on-fill)}
.btn.ghost{background:transparent;color:var(--accent-ink)}
/* nav */
.nav{display:flex;gap:6px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:thin}
.nav a{flex:none;text-decoration:none;color:var(--ink-2);font-size:13.5px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.nav a.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
/* sections */
section{margin-top:44px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:clamp(18px,3vw,30px)}
.num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:14px;margin-inline-end:10px;flex:none}
h2{font-size:clamp(22px,3.2vw,30px);line-height:1.25;margin:0 0 10px;font-weight:700;display:flex;align-items:flex-start;text-wrap:balance}
[dir="rtl"] h2{line-height:1.5}
h3{font-size:16px;margin:26px 0 10px;font-weight:600;color:var(--ink)}
.lead{font-size:clamp(17px,2.1vw,19.5px);color:var(--ink);margin:0 0 18px;max-width:70ch;font-weight:500}
p{margin:0 0 12px;max-width:72ch}
.muted{color:var(--ink-2)}
.small{font-size:13.5px;color:var(--ink-3)}
/* summary */
.answer{border-inline-start:4px solid var(--accent);background:var(--accent-soft);border-radius:4px 14px 14px 4px;padding:18px 22px;margin:0 0 22px}
[dir="rtl"] .answer{border-radius:14px 4px 4px 14px}
.answer h3{margin:0 0 6px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink)}
[dir="rtl"] .answer h3{letter-spacing:0;text-transform:none;font-size:15px}
.answer p{margin:0;font-size:clamp(16.5px,2vw,19px);max-width:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:0 0 6px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--surface)}
.kpi .v{font-size:clamp(34px,5vw,48px);line-height:1.05;font-weight:700;letter-spacing:-.02em;color:var(--ink);direction:ltr;unicode-bidi:isolate;display:inline-block}
.kpi .u{display:block;font-size:14px;color:var(--ink-2);font-weight:600;margin-top:2px}
.kpi .l{display:block;margin-top:8px;font-size:14px;color:var(--ink-2);line-height:1.5}
.kpi.hero{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),transparent)}
.actions{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.actions li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.actions .n{flex:none;width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--on-fill);display:grid;place-items:center;font-weight:700;font-size:13px}
/* charts */
.chart{margin:18px 0 6px}
.ctitle{font-size:14.5px;font-weight:600;margin:0 0 12px;color:var(--ink)}
.grp{font-size:12.5px;font-weight:600;color:var(--ink-3);margin:14px 0 6px}
.row{display:grid;grid-template-columns:minmax(110px,190px) 1fr;gap:12px;align-items:center;margin:7px 0}
.row .lb{font-size:14px;color:var(--ink-2);line-height:1.35}
.track{display:flex;align-items:center;gap:10px;min-width:0}
.fill{height:20px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px;flex:none;transition:width .5s ease}
[dir="rtl"] .fill{border-radius:4px 0 0 4px}
.fill.b2{background:var(--s2)}
.val{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.pair{display:grid;gap:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 10px;font-size:13.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px;background:var(--accent)}
.legend i.b2{background:var(--s2)}
.cols{display:flex;align-items:flex-end;gap:clamp(8px,3vw,22px);height:210px;border-bottom:1px solid var(--axis);padding:22px 4px 0}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;max-width:90px;margin-inline:auto}
.col .bar2{width:min(100%,44px);background:var(--accent);border-radius:4px 4px 0 0}
.col .bar2.hi{background:var(--s2)}
.col .cv{font-size:13px;font-weight:600;margin-bottom:5px;direction:ltr;unicode-bidi:isolate}
.collab{display:flex;gap:clamp(8px,3vw,22px);padding:6px 4px 0}
.collab div{flex:1;max-width:90px;margin-inline:auto;text-align:center;font-size:13px;color:var(--ink-2)}
.svgwrap{direction:ltr}
svg text{font-family:var(--font);fill:var(--ink-2);font-size:11px}
svg .grid{stroke:var(--line);stroke-width:1}
svg .axis{stroke:var(--axis);stroke-width:1}
svg .curve{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg .area{fill:var(--accent);opacity:.10}
svg .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg .dot2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
svg .diag{stroke:var(--axis);stroke-width:1}
svg .lab{fill:var(--ink);font-weight:600;font-size:11.5px}
/* callouts and tables */
.note{border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:12px;padding:14px 16px;margin:18px 0 0;font-size:15px}
.note b:first-child,.ok b:first-child{display:block;margin-bottom:2px}
.ok{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px 16px;margin:18px 0 0;font-size:15px}
.tw{overflow-x:auto;margin:10px 0 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{padding:10px 14px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end;white-space:nowrap}
td .ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.hi{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px}
.two>*,.card,.track,.row>*{min-width:0}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}.row{grid-template-columns:1fr;gap:3px}.hero{padding-top:28px}}
ul.clean{margin:0;padding-inline-start:20px}
ul.clean li{margin:7px 0;max-width:72ch}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.steps li{display:grid;grid-template-columns:130px 1fr;gap:6px 18px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.steps .w{font-weight:700;color:var(--accent-ink)}
@media (max-width:620px){.steps li{grid-template-columns:1fr}}
footer{margin:56px 0 40px;padding-top:20px;border-top:1px solid var(--line);color:var(--ink-3);font-size:13.5px}
footer p{max-width:none}
@media print{
  .bar,.nav,.cta,.tools{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card,.kpi,.actions li,.steps li{box-shadow:none;break-inside:avoid}
  section{margin-top:26px}
  .fill,.col .bar2{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

  rows:[["Large suppliers","25.0%","77.1%","92.7%"],["Medium suppliers","45.2%","22.2%","7.3%"],["Small suppliers","29.9%","0.8%","0.0%"],["Aerospace","10.1%","26.3%","47.8%"],["Pharmaceuticals","15.0%","24.1%","25.5%"],["Automotive","24.9%","24.5%","16.4%"],["Electronics","29.8%","20.8%","9.5%"],["Consumer Goods","20.2%","4.3%","0.8%"]],

 rc:{h:"Recommendations",
  lead:"Ordered by expected impact against effort. Strength shows how firmly the data support each one.",
  th:["#","Recommendation","Evidence","Strength","Effort"],
  rows:[
   ["Close the backup-supplier gap, starting with the 30.4% of large suppliers that have none, then small (45.2% covered) and medium (54.7%) suppliers.","Full recovery 28.1% faster (about 25 days); odds of a permanent supplier change almost halved (0.52); response starts 43.3% sooner.","High","High"],
   ["Make Alternative Supplier the default response whenever a backup exists; use Customer Delay only when nothing better is available.","Customer Delay adds 28.8% to full recovery and 84.6% to partial recovery.","High for recovery time; no effect on loss","Low"],
   ["Concentrate protection on the costly top: large aerospace and pharmaceutical suppliers and the five costliest segments.","6.3% of incidents, 28.5% of loss; large suppliers hold 92.7% of the costliest 1%.","High","Medium"],
   ["Set an escalation rule for severity 4 and 5 incidents and for recoveries beyond 60 days: review the supplier and prepare the alternative early.","Permanent change reaches 39.6% to 40.8% at severity 4 and 5, and 29.6% to 34.1% when recovery exceeds 61 days.","Moderate","Low"],
   ["Do not fund faster response as a stand-alone goal; treat it as good practice, not as a lever.","Effect of response time on recovery is statistically zero (−0.005% per day).","Moderate","—"],
   ["Improve data capture: dates, the cost of each action, and precise definitions of response time and of backup status at the time of the event.","See Limits.","—","Low"]],
  nt:"What not to do",
  nb:["Do not prioritize by region or by disruption type; neither adds explanatory power once size, industry and severity are known.","Do not expect a backup supplier to lower the revenue lost in a single event. Its value lies in faster recovery and a steadier supplier relationship; weigh the cost of coverage against those gains.","Do not read raw strategy averages as a ranking."]},
 lm:{h:"Limits and how far to trust this",
  b:["<b>Association, not proof of cause.</b> The data are observational. Adjusted effects are the best comparison the data allow, not an experiment.","<b>The data look unusually regular.</b> Supplier region has no effect on anything and every industry has almost the same average recovery time (75.6 to 76.3 days). The file may be simulated; validate on the company's own records before major decisions.","<b>No dates.</b> Trends, seasonality and whether a backup supplier existed before the event cannot be checked.","<b>Ambiguous response time.</b> In 5,722 incidents (5.7%) it exceeds the time to partial recovery. Either way its effect stays below 1% per day.","<b>Significance is not importance.</b> With 100,000 incidents even tiny effects look statistically significant; judge by effect size.","<b>Limited predictability.</b> The models explain 46% of the variation in recovery time and 60% in loss; a large part remains unexplained."]},
 nx:{h:"Next steps", th:["When","Step","Purpose"],
  rows:[["First 30 days","Confirm the definitions with the data owner: response time, the severity scale, and whether a backup supplier was in place before the event.","Remove the main ambiguities."],["First 30 days","Repeat this analysis on the company's own records, with dates.","Confirm the figures hold outside this file."],["1 to 3 months","Build a cost-benefit model for backup suppliers: cost of qualifying one against about 25 days of recovery saved and a lower chance of a forced supplier change.","Decide where coverage pays off first."],["3 to 6 months","Roll out backup coverage in phases and compare against suppliers not yet covered.","Turn an association into a measured effect."],["Ongoing","Refresh the dashboard monthly and track backup coverage, recovery time by strategy and loss concentration.","Keep the evidence current."]]},
 mt:{h:"Method and data quality",
  p:["Every figure in this report and in the interactive dashboard comes from one analysis script run on the same cleaned file, so the numbers match everywhere. Revenue loss and recovery days were analyzed on a logarithmic scale because losses are strongly right-skewed (mean USD 2.52 million against a median of USD 0.88 million). Effects were estimated with multiple regression and robust standard errors, odds with logistic regression, concentration with the Pareto curve, Gini coefficient and lift, and predictability with gradient-boosted trees tested on 20% of incidents held out.",
   "<b>Data quality.</b> No missing values, no duplicate rows or identifiers, consistent labels. Nothing was removed. Flagged and kept: 738 incidents with a loss exactly at the USD 10,000 floor, 8 incidents with 100% production impact, 5,722 incidents whose response time exceeds partial recovery time, and 10,620 statistical outliers in loss, which are real. Sensitivity tests without the first and third groups leave the conclusions unchanged."],
  rg:["<b>Adjusted</b> means after holding the other factors equal: the fair comparison.","<b>Reference group:</b> every multiplier is relative to one group (Small, Consumer Goods, severity 1, Alternative Supplier).","<b>95% CI (confidence interval):</b> if it includes zero (or 1 for ratios), the effect cannot be told apart from no effect."]},

function iso(html){ // isolate numbers so RTL text never reorders signs/percent
  if(LANG!=="ar") return html;
  return html.replace(/(^|[^\w<\/="'.#])([−+]?\d[\d.,]*(?:\s?%)?)/g,function(m,a,b){return a+'<bdi dir="ltr">'+b+'</bdi>'});
}
function I(s){return iso(esc(s))}

/* ---------------- chart builders ---------------- */
function barRows(items,max,cls){
  return items.map(function(it){
    var w=Math.max(0.5,it.v/max*100);
    return '<div class="row"><div class="lb">'+it.l+'</div><div class="track"><div class="fill '+(it.c||cls||'')+'" style="width:calc('+w.toFixed(2)+'% - 56px)" title="'+it.l+': '+it.t+'"></div><span class="val">'+it.t+'</span></div></div>';
  }).join('');
}
function mult(v){return nf(v,2)+"×"}
function chartLoss(t){
  var A=[[11.66,"Large"],[3.31,"Medium"]];
  var sz=LANG==="ar"?["كبير","متوسط"]:LANG==="es"?["Grande","Mediano"]:["Large","Medium"];
  var ind=LANG==="ar"?["الطيران والفضاء","الأدوية","السيارات","الإلكترونيات"]:LANG==="es"?["Aeroespacial","Farmacéutico","Automoción","Electrónica"]:["Aerospace","Pharmaceuticals","Automotive","Electronics"];
  var sev=LANG==="ar"?["الشدّة 2","الشدّة 3","الشدّة 4","الشدّة 5"]:LANG==="es"?["Severidad 2","Severidad 3","Severidad 4","Severidad 5"]:["Severity 2","Severity 3","Severity 4","Severity 5"];
  var G=[[sz,[11.66,3.31]],[ind,[6.14,3.62,2.47,1.87]],[sev,[2.39,3.90,5.22,6.58]]];
  var h='';
  G.forEach(function(g,i){
    h+='<div class="grp">'+t.g[i]+'</div>'+barRows(g[0].map(function(l,j){return {l:l,v:g[1][j],t:mult(g[1][j])}}),12);
  });
  return h;
}
function chartContrib(){
  var L=LANG==="ar"?["حجم المورّد","القطاع","الشدّة","مستوى المورّد","نوع التعطّل","منطقة المورّد","مورّد احتياطي","استراتيجية الاستجابة"]
       :LANG==="es"?["Tamaño del proveedor","Sector","Severidad","Nivel del proveedor","Tipo de interrupción","Región del proveedor","Proveedor de respaldo","Estrategia de respuesta"]
       :["Supplier size","Industry","Severity","Supplier tier","Disruption type","Supplier region","Backup supplier","Response strategy"];
  var V=[32.0,11.3,10.6,1.9,0,0,0,0];
  return barRows(L.map(function(l,i){return {l:l,v:V[i],t:nf(V[i],1)}}),34);
}
function chartBackup(t){
  var S=LANG==="ar"?["كبير","متوسط","صغير"]:LANG==="es"?["Grande","Mediano","Pequeño"]:["Large","Medium","Small"];
  var W=[52,53,52], O=[74,74,73], h='<div class="legend"><span><i></i>'+t.w+'</span><span><i class="b2"></i>'+t.wo+'</span></div>';
  S.forEach(function(s,i){
    h+='<div class="row"><div class="lb">'+s+'</div><div class="pair">'
      +'<div class="track"><div class="fill" style="width:calc('+(W[i]/80*100)+'% - 60px)" title="'+t.w+': '+W[i]+'"></div><span class="val">'+W[i]+'</span></div>'
      +'<div class="track"><div class="fill b2" style="width:calc('+(O[i]/80*100)+'% - 60px)" title="'+t.wo+': '+O[i]+'"></div><span class="val">'+O[i]+'</span></div></div></div>';
  });
  return h;
}
function chartStrategy(t){
  var F=[5.9,8.6,15.7,28.8], P=[13.1,21.3,42.1,84.6];
  var h='<div class="legend"><span><i></i>'+t.f+'</span><span><i class="b2"></i>'+t.p+'</span></div>';
  t.s.forEach(function(s,i){
    h+='<div class="row"><div class="lb">'+s+'</div><div class="pair">'
     +'<div class="track"><div class="fill" style="width:calc('+(F[i]/90*100)+'% - 70px)" title="'+t.f+': +'+pct(F[i],1)+'"></div><span class="val">+'+pct(F[i],1)+'</span></div>'
     +'<div class="track"><div class="fill b2" style="width:calc('+(P[i]/90*100)+'% - 70px)" title="'+t.p+': +'+pct(P[i],1)+'"></div><span class="val">+'+pct(P[i],1)+'</span></div></div></div>';
  });
  return h;
}
function chartSeverity(t){
  var V=[16.4,20.2,23.2,39.6,40.8], h='<div class="cols">';
  V.forEach(function(v,i){
    h+='<div class="col"><span class="cv">'+pct(v,1)+'</span><div class="bar2'+(i>=3?' hi':'')+'" style="height:'+(v/45*100)+'%" title="'+t.sev+' '+(i+1)+': '+pct(v,1)+'"></div></div>';
  });
  h+='</div><div class="collab">';
  V.forEach(function(v,i){h+='<div>'+t.sev+' '+(i+1)+'</div>'});
  return h+'</div>';
}
function chartPareto(t){
  var W=640,H=340,L=56,R=16,Tp=18,B=48, pw=W-L-R, ph=H-Tp-B;
  var X=function(x){return L+x*pw}, Y=function(y){return Tp+(1-y)*ph};
  var d=PARETO.map(function(p,i){return (i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)}).join(' ');
  var area=d+' L'+X(1)+' '+Y(0)+' L'+X(0)+' '+Y(0)+' Z';
  var g='',k;
  for(k=0;k<=5;k++){var v=k/5; g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+nf(v*100,0)+(LANG==="es"?" %":"%")+'</text><text x="'+X(v)+'" y="'+(H-B+18)+'" text-anchor="middle">'+nf(v*100,0)+(LANG==="es"?" %":"%")+'</text>';}
  var p1=[0.10,0.5516], p2=[0.27,0.80];
  return '<div class="svgwrap"><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+t.c1+'">'+g
   +'<line class="axis" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'"/>'
   +'<line class="diag" x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(1)+'" y2="'+Y(1)+'" stroke-dasharray="0"/>'
   +'<path class="area" d="'+area+'"/><path class="curve" d="'+d+'"/>'
   +'<circle class="dot" cx="'+X(p1[0])+'" cy="'+Y(p1[1])+'" r="5"/><circle class="dot2" cx="'+X(p2[0])+'" cy="'+Y(p2[1])+'" r="5"/>'
   +'<text class="lab" x="'+(X(p1[0])+12)+'" y="'+(Y(p1[1])+28)+'">'+t.p1+'</text>'
   +'<text class="lab" x="'+(X(p2[0])+12)+'" y="'+(Y(p2[1])+22)+'">'+t.p2+'</text>'
   +'<text x="'+(X(0.62))+'" y="'+(Y(0.62)+18)+'">'+t.eq+'</text>'
   +'<text x="'+(L+pw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+t.xl+'</text>'
   +'</svg></div>';
}

/* ---------------- tables ---------------- */
function table(th,rows,opts){
  opts=opts||{};
  var h='<div class="tw"><table><thead><tr>'+th.map(function(x,i){return '<th'+(opts.num&&opts.num.indexOf(i)>-1?' class="n"':'')+'>'+I(x)+'</th>'}).join('')+'</tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr>'+r.map(function(c,i){return '<td'+(opts.num&&opts.num.indexOf(i)>-1?' class="n"':'')+'>'+(opts.chip&&opts.chip.indexOf(i)>-1?'<span class="chip'+(i===3&&(c.indexOf('High')===0||c.indexOf('Alta')===0||c.indexOf('عالية')===0)?' hi':'')+'">'+I(c)+'</span>':I(c))+'</td>'}).join('')+'</tr>';
  });
  return h+'</tbody></table></div>';
}

/* ---------------- render ---------------- */
function render(){
  var t=T[LANG], h='';
  document.documentElement.lang=t.lang; document.documentElement.dir=t.dir;
  document.title=t.doc;
  var md=document.querySelector('meta[name=description]'); if(md) md.setAttribute('content',t.sub);
  var ids=["summary","loss","backup","response","change","risk","recs","limits","next","method"];
  h+='<header class="hero"><div class="eyebrow">'+t.eyebrow+'</div><h1>'+I(t.h1)+'</h1><p class="sub">'+I(t.sub)+'</p>'
    +'<div class="meta">'+t.meta.map(function(m){return '<span>'+I(m)+'</span>'}).join('')+'</div>'
    +'<div class="cta"><a class="btn" href="'+DASHBOARD_URL+'?lang='+LANG+'">'+t.cta1+'</a><a class="btn ghost" href="#recs">'+t.cta2+'</a></div></header>';
  h+='<nav class="nav" aria-label="Sections">'+ids.map(function(id,i){return '<a href="#'+id+'" data-id="'+id+'">'+t.nav[i]+'</a>'}).join('')+'</nav>';

  // summary
  var s=t.sum;
  h+='<section id="summary"><div class="card"><h2><span class="num">1</span>'+I(s.h)+'</h2>'
   +'<div class="answer"><h3>'+s.bl+'</h3><p>'+I(s.bt)+'</p></div>'
   +'<div class="kpis">'+s.kpis.map(function(k){return '<div class="kpi'+(k.hero?' hero':'')+'"><span class="v">'+k.v+'</span>'+(k.u?'<span class="u">'+k.u+'</span>':'')+'<span class="l">'+I(k.l)+'</span></div>'}).join('')+'</div>'
   +'<h3>'+s.ah+'</h3><ol class="actions">'+s.acts.map(function(a,i){return '<li><span class="n">'+(i+1)+'</span><span>'+I(a)+'</span></li>'}).join('')+'</ol>'
   +'<div class="ok"><b>'+(LANG==="ar"?"حدود الثقة":LANG==="es"?"Grado de confianza":"How far to trust this")+'</b>'+I(s.tr)+'</div></div></section>';

  // loss
  var l=t.loss;
  h+='<section id="loss"><div class="card"><h2><span class="num">2</span>'+I(l.h)+'</h2><p class="lead">'+I(l.lead)+'</p>'
   +'<div class="two"><div class="chart"><div class="ctitle">'+l.c1+'</div>'+chartLoss(l)+'</div><div class="chart"><div class="ctitle">'+l.c2+'</div>'+chartContrib()+'</div></div>'
   +'<div class="ok"><b></b>'+I(l.note)+'</div><p class="small" style="margin-top:12px">'+I(l.src)+'</p></div></section>';

  // backup
  var b=t.bk;
  h+='<section id="backup"><div class="card"><h2><span class="num">3</span>'+I(b.h)+'</h2><p class="lead">'+I(b.lead)+'</p>'
   +'<div class="chart"><div class="ctitle">'+b.c1+'</div>'+chartBackup(b)+'</div><h3>'+b.th0+'</h3>'+table(b.th,b.rows,{num:[1,2]})
   +'<div class="note"><b>'+b.trap+'</b>'+I(b.trapt)+'</div><p style="margin-top:14px">'+I(b.ins)+'</p></div></section>';

  // response
  var r=t.rs;
  h+='<section id="response"><div class="card"><h2><span class="num">4</span>'+I(r.h)+'</h2><p class="lead">'+I(r.lead)+'</p>'
   +'<div class="chart"><div class="ctitle">'+r.c1+'</div>'+chartStrategy(r)+'</div><p class="small">'+I(r.nb)+'</p>'
   +'<h3>'+r.h2+'</h3><p>'+I(r.t1)+'</p><p><b>'+I(r.t2)+'</b></p><div class="note"><b></b>'+I(r.note)+'</div></div></section>';

  // change
  var c=t.ch;
  h+='<section id="change"><div class="card"><h2><span class="num">5</span>'+I(c.h)+'</h2><p class="lead">'+I(c.lead)+'</p>'
   +'<div class="two"><div class="chart"><div class="ctitle">'+c.c1+'</div>'+chartSeverity(c)+'</div><ul class="clean">'+c.b.map(function(x){return '<li>'+I(x)+'</li>'}).join('')+'</ul></div></div></section>';

  // risk
  var k=t.rk;
  h+='<section id="risk"><div class="card"><h2><span class="num">6</span>'+I(k.h)+'</h2><p class="lead">'+I(k.lead)+'</p>'
   +'<div class="chart"><div class="ctitle">'+k.c1+'</div>'+chartPareto(k)+'</div>'
   +table(k.th,k.rows,{num:[1,2,3]})
   +'<div class="ok"><b></b>'+I(k.note)+'</div><h3>'+k.pr+'</h3><p>'+I(k.prt)+'</p></div></section>';

  // recs
  var q=t.rc;
  h+='<section id="recs"><div class="card"><h2><span class="num">7</span>'+I(q.h)+'</h2><p class="lead">'+I(q.lead)+'</p>'
   +table(q.th,q.rows.map(function(r2,i){return [String(i+1)].concat(r2)}),{chip:[3,4]})
   +'<h3>'+q.nt+'</h3><ul class="clean">'+q.nb.map(function(x){return '<li>'+I(x)+'</li>'}).join('')+'</ul></div></section>';

  // limits
  var m=t.lm;
  h+='<section id="limits"><div class="card"><h2><span class="num">8</span>'+I(m.h)+'</h2><ul class="clean">'+m.b.map(function(x){return '<li>'+I(x)+'</li>'}).join('')+'</ul></div></section>';

  // next
  var n=t.nx;
  h+='<section id="next"><div class="card"><h2><span class="num">9</span>'+I(n.h)+'</h2><ol class="steps">'+n.rows.map(function(r3){return '<li><span class="w">'+I(r3[0])+'</span><span><b>'+I(r3[1])+'</b><br><span class="muted">'+I(r3[2])+'</span></span></li>'}).join('')+'</ol></div></section>';

  // method
  var e=t.mt;
  h+='<section id="method"><div class="card"><h2><span class="num">10</span>'+I(e.h)+'</h2>'+e.p.map(function(x){return '<p>'+I(x)+'</p>'}).join('')+'<ul class="clean">'+e.rg.map(function(x){return '<li>'+I(x)+'</li>'}).join('')+'</ul></div></section>';

  h+='<footer><p>'+I(t.ft)+'</p></footer>';
  $('#app').innerHTML=h;

  // chrome
  var hl=$('#homeLink'); hl.textContent=t.home; hl.href=SITE_HOME+(SITE_HOME.indexOf('?')<0?'?':'&')+'lang='+LANG;
  $('#themeBtn').textContent=t.theme; $('#printBtn').textContent=t.print;
  document.querySelectorAll('.seg button').forEach(function(bt){bt.setAttribute('aria-pressed',bt.getAttribute('data-l')===LANG)});
  observe();
}

/* ---------------- behavior ---------------- */
var io=null;
function observe(){
  if(io) io.disconnect();
  if(!('IntersectionObserver' in window)) return;
  io=new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting){
      document.querySelectorAll('.nav a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-id')===en.target.id)});
    }});
  },{rootMargin:'-30% 0px -60% 0px'});
  document.querySelectorAll('main section').forEach(function(s){io.observe(s)});
}
function setLang(l,persist){
  LANG=T[l]?l:"en"; render();
  if(persist){ try{localStorage.setItem('scr-lang',LANG)}catch(e){} try{history.replaceState(null,'',location.pathname+location.search.replace(/([?&])lang=[^&]*&?/,'$1').replace(/[?&]$/,'')+(location.hash||''))}catch(e){} }
}
function initLang(){
  var q=(location.search.match(/[?&]lang=(ar|en|es)/)||[])[1], st=null;
  try{st=localStorage.getItem('scr-lang')}catch(e){}
  var nav=(navigator.language||'en').slice(0,2);
  return q||(T[st]?st:null)||(T[nav]?nav:'en');
}
document.querySelectorAll('.seg button').forEach(function(bt){bt.addEventListener('click',function(){setLang(bt.getAttribute('data-l'),true)})});
$('#themeBtn').addEventListener('click',function(){
  var r=document.documentElement, cur=r.getAttribute('data-theme');
  var dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  var nt=dark?'light':'dark';
  if(window.GuruTheme)GuruTheme.persist(nt);else r.setAttribute('data-theme',nt);
});
$('#printBtn').addEventListener('click',function(){window.print()});
LANG=initLang(); render();
</script>
<script>
/* Guru site bridge: when embedded in the project page it syncs language/theme, reports its height,
   routes in-page links to the host page and handles print. Standalone it does nothing. */
(function(){
  if(window.parent===window){
    document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest(".seg button[data-l]");
      if(b){try{localStorage.setItem("guru-lang",b.getAttribute("data-l"))}catch(_e){}}});
    return;
  }
  var tm=/[?&]theme=(dark|light)/.exec(location.search);if(tm)document.documentElement.setAttribute("data-theme",tm[1]);
  var st=document.createElement("style");
  st.textContent=".bar{display:none!important} html{scroll-padding-top:0} body{padding-block:0 8px}";
  document.head.appendChild(st);
  addEventListener("message",function(e){var d=e.data;if(!d)return;
    if(d.type==="guru-print"){window.print();return}
    if(d.type!=="guru-sync")return;
    if(d.theme==="dark"||d.theme==="light")document.documentElement.setAttribute("data-theme",d.theme);
    if(d.lang){var b=document.querySelector('.seg button[data-l="'+d.lang+'"]');if(b&&b.getAttribute("aria-pressed")!=="true")b.click()}});
  document.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;
    var h=a.getAttribute("href")||"";
    if(h.charAt(0)==="#"&&h.length>1){var t=document.getElementById(h.slice(1));
      if(t){e.preventDefault();parent.postMessage({type:"guru-goto",y:Math.round(t.getBoundingClientRect().top+window.scrollY)},"*")}}
    else if(/(^|\/)dashboard\.html(\?.*)?$/.test(h)){e.preventDefault();parent.postMessage({type:"guru-open",id:"dashboard"},"*")}
  });
  function h(){parent.postMessage({type:"guru-height",h:Math.ceil(document.body.getBoundingClientRect().height)},"*")}
  if(window.ResizeObserver)new ResizeObserver(h).observe(document.body);
  addEventListener("load",h);
  parent.postMessage({type:"guru-ready"},"*");
})();
</script>
